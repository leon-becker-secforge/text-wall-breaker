name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # The floor from requires-python and the version .python-version pins: a stdlib API
    # newer than the floor must fail here, not on a user's machine.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      # Actions are pinned by commit: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # --locked fails if uv.lock has drifted from pyproject.toml.
      - name: Sync
        run: uv sync --locked

      - name: ruff format
        run: uv run --no-sync ruff format --check .

      - name: ruff lint
        run: uv run --no-sync ruff check .

      - name: ty
        run: uv run --no-sync ty check

      - name: pytest
        run: uv run --no-sync pytest -q
