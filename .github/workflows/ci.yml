name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv stopped publishing floating major tags after v7, so this has to be an
        # exact version: @v10 does not resolve.
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --locked fails if uv.lock has drifted from pyproject.toml.
      - name: Sync
        run: uv sync --locked

      - name: ruff format
        run: uv run --no-sync ruff format --check .

      - name: ruff lint
        run: uv run --no-sync ruff check .

      - name: ty
        run: uv run --no-sync ty check

      - name: pytest
        run: uv run --no-sync pytest -q
