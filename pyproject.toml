[project]
name = "text-wall-breaker"
version = "0.21.0"
description = "MCP server that asks the user questions, or shows them results, in a browser page"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    # 2.0 renamed FastMCP to MCPServer and changed the module path; server.py targets
    # the 2.x API, so the major is pinned rather than left open.
    "mcp>=2.2,<3",
    "pydantic>=2.7",
    # The rendered view of a Markdown file; its block source lines (token.map) place comments.
    "markdown-it-py>=3",
    # Token spans for the code rows of a review diff.
    "pygments>=2.15",
]

[project.scripts]
text-wall-breaker-mcp = "text_wall_breaker.server:main"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_wall_breaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
include = ["src", "tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on internals and use bare asserts by design.
"tests/*" = ["S101", "ARG001", "ARG005"]

[tool.ruff.lint.isort]
known-first-party = ["text_wall_breaker"]
