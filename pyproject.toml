[project]
name = "pretty-prompt"
version = "0.11.0"
description = "MCP server that asks the user questions, or shows them results, in a browser page"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 2.0 renamed FastMCP to MCPServer and changed the module path; server.py targets
    # the 2.x API, so the major is pinned rather than left open.
    "mcp>=2.2,<3",
    "pydantic>=2.7",
]

[project.scripts]
pretty-prompt-mcp = "pretty_prompt.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pretty_prompt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
include = ["src", "tests"]

# ruff and the dev dependency group are configured once at the workspace root.
